<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#007AFF">
  <meta name="description" content="Tuple - 언어 교환 모바일 앱">
  <meta name="author" content="Tuple Team">
  
  <!-- Open Graph / 소셜 미디어 공유 -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Tuple - Language Exchange App">
  <meta property="og:description" content="언어 교환 및 학습을 위한 모바일 앱">
  <meta property="og:image" content="/assets/icon.png">
  
  <!-- PWA 설정 -->
  <link rel="manifest" href="/manifest.json">
  
  <title>Tuple - Language Exchange App</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    html, body, #root {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: transparent;
    }
    
    #root {
      background: linear-gradient(135deg, #26D599 0%, #3B82D9 100%);
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
        'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
        sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      /* background-color 제거 - React Native 컴포넌트의 배경색 사용 */
    }
    
    /* 로딩 화면 */
    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #007AFF;
      z-index: 9999;
    }
    
    #loading h1 {
      color: white;
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 20px;
    }
    
    #loading .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    /* 앱이 로드되면 로딩 화면 숨김 */
    .loaded #loading {
      display: none;
    }
  </style>
</head>
<body>
  <!-- 로딩 화면 -->
  <div id="loading">
    <h1>🎨 Tuple</h1>
    <div class="spinner"></div>
  </div>
  
  <!-- React Native Web 앱이 여기에 마운트됨 -->
  <div id="root"></div>
  
  <script>
    // 앱 로드 완료 후 로딩 화면 제거
    window.addEventListener('load', function() {
      setTimeout(function() {
        document.body.classList.add('loaded');
      }, 500);
    });
  </script>
</body>
</html>
